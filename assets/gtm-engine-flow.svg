<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="Helvetica, Arial, sans-serif" font-size="13" role="img" aria-label="Three workflows hand off through one Google Sheet">
<rect width="760" height="480" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8f98"/></marker></defs>
<text x="24" y="30" font-size="15" font-weight="600" fill="#1f2328">Three workflows hand off through one Google Sheet</text>
<text x="24" y="52" font-size="11.5" fill="#57606a">Blue boxes are workflows; grey boxes are tabs in the GTM Engine sheet</text>
<g fill="none" stroke="#8a8f98" stroke-width="1.25"><path d="M196.0 120H270.0" marker-end="url(#a)"/><path d="M490.0 120H564.0" marker-end="url(#a)"/><path d="M196.0 270H270.0" marker-end="url(#a)"/><path d="M490.0 270H564.0" marker-end="url(#a)"/><path d="M650 156.0V195H380V234.0" marker-end="url(#a)"/><path d="M650 306.0V420H490.0" marker-end="url(#a)"/><path d="M270.0 420H196.0" marker-end="url(#a)"/></g>
<text x="515" y="187" text-anchor="middle" font-size="11.5" fill="#57606a">brief lookup by domain</text>
<text x="570" y="412" text-anchor="middle" font-size="11.5" fill="#57606a">pending hot leads</text>
<rect x="24.0" y="84.0" width="172" height="72" rx="8" fill="#eef0f3" stroke="#8a8f98" stroke-width="1.25"/><text x="110" y="114" text-anchor="middle" font-weight="600" fill="#1f2328">Target Accounts</text><text x="110" y="134" text-anchor="middle" font-size="11.5" fill="#57606a">Accounts marked New</text>
<rect x="270.0" y="84.0" width="220" height="72" rx="8" fill="#e7f0fd" stroke="#1f6feb" stroke-width="2"/><text x="380" y="108" text-anchor="middle" font-weight="600" fill="#1f2328">1 · Account research</text><text x="380" y="124" text-anchor="middle" font-size="11.5" fill="#1f2328">Reads site and news, writes</text><text x="380" y="140" text-anchor="middle" font-size="11.5" fill="#1f2328">an ICP brief, posts to Slack</text>
<rect x="564.0" y="84.0" width="172" height="72" rx="8" fill="#eef0f3" stroke="#8a8f98" stroke-width="1.25"/><text x="650" y="114" text-anchor="middle" font-weight="600" fill="#1f2328">Account Briefs</text><text x="650" y="134" text-anchor="middle" font-size="11.5" fill="#57606a">One brief per account</text>
<rect x="24.0" y="234.0" width="172" height="72" rx="8" fill="#ffffff" stroke="#8a8f98" stroke-width="1.25"/><text x="110" y="264" text-anchor="middle" font-weight="600" fill="#1f2328">Lead form</text><text x="110" y="284" text-anchor="middle" font-size="11.5" fill="#57606a">Public n8n form</text>
<rect x="270.0" y="234.0" width="220" height="72" rx="8" fill="#e7f0fd" stroke="#1f6feb" stroke-width="2"/><text x="380" y="258" text-anchor="middle" font-weight="600" fill="#1f2328">2 · Score and route</text><text x="380" y="274" text-anchor="middle" font-size="11.5" fill="#1f2328">AI scores fit and intent;</text><text x="380" y="290" text-anchor="middle" font-size="11.5" fill="#1f2328">rules set the tier, alert BDR</text>
<rect x="564.0" y="234.0" width="172" height="72" rx="8" fill="#eef0f3" stroke="#8a8f98" stroke-width="1.25"/><text x="650" y="264" text-anchor="middle" font-weight="600" fill="#1f2328">Lead Log</text><text x="650" y="284" text-anchor="middle" font-size="11.5" fill="#57606a">Every lead, scored</text>
<rect x="24.0" y="384.0" width="172" height="72" rx="8" fill="#ffffff" stroke="#8a8f98" stroke-width="1.25"/><text x="110" y="414" text-anchor="middle" font-weight="600" fill="#1f2328">Gmail draft</text><text x="110" y="434" text-anchor="middle" font-size="11.5" fill="#57606a">Touch 1, after approval</text>
<rect x="270.0" y="384.0" width="220" height="72" rx="8" fill="#e7f0fd" stroke="#1f6feb" stroke-width="2"/><text x="380" y="408" text-anchor="middle" font-weight="600" fill="#1f2328">3 · Draft and approve</text><text x="380" y="424" text-anchor="middle" font-size="11.5" fill="#1f2328">Writes a 3-touch sequence,</text><text x="380" y="440" text-anchor="middle" font-size="11.5" fill="#1f2328">waits for your Gmail approval</text>
</svg>